    <text x="964" y="380" fill="#102029" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700">motion=true</text>
    <text x="964" y="403" fill="#51606F" font-family="Manrope, sans-serif" font-size="18">tts=true | home=true</text>
  </g>

