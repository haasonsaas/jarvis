<svg width="1280" height="840" viewBox="0 0 1280 840" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="1200" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE0A8"/>
      <stop offset="0.48" stop-color="#DCEBF0"/>
      <stop offset="1" stop-color="#BED4DE"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF9F2" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F8891"/>
      <stop offset="1" stop-color="#095360"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1280" height="840" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#102029" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="840" rx="36" fill="url(#bg)"/>
  <circle cx="176" cy="122" r="120" fill="#FFBF70" fill-opacity="0.45"/>
  <circle cx="1092" cy="118" r="132" fill="#6DBFD2" fill-opacity="0.36"/>

